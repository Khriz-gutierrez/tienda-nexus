<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título y Descripción Estándar -->
    <title>NexusGear Store</title>
    <meta name="description" content="Descubre las últimas tendencias en moda urbana, calzado y accesorios en NexusGear." />

    <!-- Protocolo Open Graph (OG) para WhatsApp, Facebook, LinkedIn (Despliegue de URLs) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NexusGear - Tu Tienda de Moda y Accesorios" />
    <meta property="og:description" content="Catálogo completo de prendas de vestir, accesorios y calzado al mejor precio." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=600" />
    <meta property="og:url" content="https://tienda-nexus.vercel.app/" />

    <!-- Protocolo Twitter Cards para X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexusGear - Tu Tienda de Moda y Accesorios" />
    <meta name="twitter:description" content="Catálogo completo de prendas de vestir, accesorios y calzado al mejor precio." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=600" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Modal de Detalle de Producto -->
    <div id="product-detail-modal" class="modal hidden">
      <div class="modal-content">
        <span id="close-detail-modal" class="close-modal">&times;</span>
        <div id="modal-product-body" class="product-detail-layout">
          <!-- Se llena dinámicamente desde main.ts -->
        </div>
      </div>
    </div>

    <!-- Modal de Checkout / Confirmación de Compra -->
      <div id="checkout-modal" class="modal hidden">
        <div class="modal-content">
          <span id="close-checkout-modal" class="close-modal">&times;</span>
          <div id="checkout-modal-body">
          <!-- El contenido se inyecta dinámicamente desde main.ts -->
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
